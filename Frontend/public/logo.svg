<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="100%" height="100%" fill="none">
  <!-- Logo Mark Icon -->
  <g transform="translate(5, 5) scale(0.5)">
    <!-- Outer Gold Rim -->
    <circle cx="60" cy="60" r="56" stroke="#C6A45C" stroke-width="2.5" stroke-dasharray="3 2" opacity="0.8" />
    <!-- Main Deep Green Circle -->
    <circle cx="60" cy="60" r="51" fill="#145A32" stroke="#103D29" stroke-width="2" />
    <circle cx="60" cy="60" r="46" stroke="#C6A45C" stroke-width="1.2" opacity="0.6" />
    
    <!-- Crescent (Gold) -->
    <path d="M 60 26 A 34 34 0 1 0 86 78 A 28 28 0 1 1 60 26 Z" fill="#C6A45C" />

    <!-- Open Book -->
    <path d="M 38 72 C 48 68 56 70 60 74 C 64 70 72 68 82 72 L 82 56 C 72 52 64 54 60 58 C 56 54 48 52 38 56 Z" fill="#FAF8F0" opacity="0.95" />
    <path d="M 60 58 L 60 74" stroke="#145A32" stroke-width="1.8" stroke-linecap="round" />

    <!-- Radiant Star -->
    <polygon points="60,33 62,39 68,39 63,43 65,49 60,45 55,49 57,43 52,39 58,39" fill="#FAF8F0" />

    <!-- Monogram badge -->
    <rect x="36" y="81" width="48" height="15" rx="7.5" fill="#FAF8F0" stroke="#C6A45C" stroke-width="1.2" />
    <text x="60" y="92" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#145A32" letter-spacing="1.2">AMWSI</text>
  </g>

  <!-- Typography -->
  <text x="75" y="27" font-family="'Manrope', 'Inter', sans-serif" font-weight="800" font-size="16" fill="#103D29" letter-spacing="0.8">
    ALL MUSLIM WELFARE SOCIETY INDIA
  </text>
  <text x="75" y="44" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#C6A45C" letter-spacing="2.2">
    EDUCATION • HEALTHCARE • COMMUNITY
  </text>
  <text x="75" y="58" font-family="'Inter', sans-serif" font-weight="400" font-size="9" fill="#68736C" letter-spacing="0.5">
    A National Social Welfare Initiative
  </text>
</svg>
